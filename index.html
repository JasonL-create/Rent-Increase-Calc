<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rent Increase Calculator</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172b27;background:#f3f6f5}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}.calc{width:min(100%,420px);background:white;border:1px solid #dce5e1;border-radius:20px;padding:24px;box-shadow:0 12px 36px #102c2410}.heading{display:flex;align-items:center;gap:12px;margin-bottom:24px}.symbol{background:#173c36;color:white;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:25px;font-weight:700}h1{font-size:19px;margin:0;letter-spacing:-.5px}.subtitle{font-size:12px;color:#72827c;margin:4px 0 0}label{display:block;font-size:12px;font-weight:750;letter-spacing:.3px;margin-bottom:8px}.field{display:flex;align-items:center;border:1px solid #d4ded9;border-radius:11px;height:58px;overflow:hidden;background:#fbfcfb}.field:focus-within{border-color:#24977b;box-shadow:0 0 0 3px #24977b20}.prefix{padding-left:14px;color:#72827c;font-size:19px}input{width:100%;min-width:0;background:none;border:0;outline:0;padding:10px 12px;font-size:24px;font-weight:700;color:#173c36;font-variant-numeric:tabular-nums}.suffix{padding-right:14px;color:#72827c;font-weight:700}.cols{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:22px}.method{position:relative;padding:11px;border:2px solid transparent;border-radius:13px;transition:background .15s,border-color .15s}.method.active{background:#e9f6f0;border-color:#22886b}.method.auto{background:#f5f7f6;border-color:#e3e9e6}.method .status{display:block;margin-top:7px;font-size:10px;letter-spacing:.5px;font-weight:800;color:#7b8882}.method.active .status{color:#166e52}.method.auto input{color:#647b72}.cols{gap:8px;margin-left:-9px;margin-right:-9px}.method label{font-size:11px;white-space:nowrap}.method .field{height:54px}.method input{font-size:22px}.hint{text-align:center;font-size:12px;color:#72827c;margin:14px 0}.result{background:#173c36;color:white;padding:22px;border-radius:14px;margin-top:17px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1px;color:#b5d4c9}.total{font-size:39px;letter-spacing:-1.4px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #ffffff30;margin-top:15px;padding-top:14px;font-size:12px;color:#c3d9d1}.bottom strong{font-size:15px;color:white;text-align:right}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:17px;gap:8px}.footer span{font-size:11px;color:#72827c}button{border:1px solid #d4ded9;background:#f7faf8;border-radius:9px;padding:10px 17px;cursor:pointer;font-weight:650;color:#173c36}@media(max-width:360px){.calc{padding:16px}.total{font-size:32px}input{font-size:20px}}
</style></head><body><main class="calc"><div class="heading"><div class="symbol">%</div><div><h1>Rent Increase Calculator</h1><p class="subtitle">Quick monthly rent calculations</p></div></div><label for="rent">CURRENT MONTHLY RENT</label><div class="field"><span class="prefix">$</span><input id="rent" type="number" min="0" step="0.01" value="1000" inputmode="decimal"></div><div class="cols"><div class="method active" id="percent-method"><label for="percent">INCREASE BY %</label><div class="field"><input id="percent" type="number" min="0" step="any" value="5" inputmode="decimal"><span class="suffix">%</span></div><span class="status" id="percent-status">● YOU ENTER</span></div><div class="method auto" id="dollars-method"><label for="dollars">INCREASE BY $</label><div class="field"><span class="prefix">$</span><input id="dollars" type="number" min="0" step="0.01" value="50.00" inputmode="decimal"></div><span class="status" id="dollars-status">AUTO CALCULATED</span></div></div><p class="hint" id="method-hint">Calculating dollar increase from percentage</p><section class="result" aria-live="polite"><div class="eyebrow">NEW MONTHLY RENT</div><div class="total" id="total">$1,050.00</div><div class="bottom"><span>Monthly increase</span><strong id="increase">+$50.00 (5%)</strong></div></section><div class="footer"><span>No data saved · Instant calculations</span><button id="reset" type="button">↺ Reset</button></div></main><script>
const $=id=>document.getElementById(id),rent=$('rent'),percent=$('percent'),dollars=$('dollars');let last='percent';const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);const val=el=>{const n=Number.parseFloat(el.value);return Number.isFinite(n)?Math.max(0,n):0};const fmt=n=>String(Number(n.toFixed(6)));function setMethod(method){last=method;for(const key of ['percent','dollars']){const el=$(key+'-method');el.classList.toggle('active',key===last);el.classList.toggle('auto',key!==last);$(key+'-status').textContent=key===last?'● YOU ENTER':'AUTO CALCULATED';} $('method-hint').textContent=last==='percent'?'Calculating dollar increase from percentage':'Calculating percentage from dollar increase';}function update(source){if(source&&source!=='rent')setMethod(source);const r=val(rent);let p=val(percent),d=val(dollars);if(last==='percent'){d=Math.round(r*p)/100;dollars.value=d.toFixed(2)}else{p=r>0?d/r*100:0;percent.value=fmt(p)}$('total').textContent=money(r+d);$('increase').textContent='+'+money(d)+' ('+fmt(p)+'%)'}rent.addEventListener('input',()=>update('rent'));percent.addEventListener('focus',()=>setMethod('percent'));dollars.addEventListener('focus',()=>setMethod('dollars'));percent.addEventListener('input',()=>update('percent'));dollars.addEventListener('input',()=>update('dollars'));$('reset').addEventListener('click',()=>{rent.value='';percent.value='';dollars.value='';setMethod('percent');$('total').textContent='$0.00';$('increase').textContent='+$0.00 (0%)';rent.focus()});
</script></body></html>
